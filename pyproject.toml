[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "claimgate"
version = "0.1.0"
description = "Publish gate for AI-assisted marketing content: substantiation, policy and AI-disclosure checks."
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
dependencies = []

[project.scripts]
claimgate = "claimgate.cli:main"

[tool.setuptools]
packages = ["claimgate"]
