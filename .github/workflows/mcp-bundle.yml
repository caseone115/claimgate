name: MCP bundle

# Builds the MCP Bundles and, on a tag, attaches them to the release the MCP
# Registry entries point at. The registry fetches each URL and requires its
# SHA-256 to equal the fileSha256 recorded in the matching registry entry, so
# this workflow and the entries have to be changed together, never by hand.
#
# Two bundles, because the registry names one package per server name and the
# free starter kit is a different thing from the paid engine:
#   claimgate-<ver>.mcpb      io.github.caseone115/claimgate
#   claimgate-kit-<ver>.mcpb  io.github.caseone115/claimgate-kit

on:
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - "mcp/**"
      - "mcp-kit/**"
      - "scripts/mcp_bundle.py"
      - "scripts/test_mcp_server.py"
      - "scripts/test_mcp_kit_server.py"
      - "scripts/check_mcpb_artifact.py"
      - ".github/workflows/mcp-bundle.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
      - name: Test the paid engine's MCP server over real stdio
        run: uv run --with mcp --python 3.12 python scripts/test_mcp_server.py
      - name: Test the free starter kit's MCP server over real stdio
        run: uv run --with mcp --python 3.12 python scripts/test_mcp_kit_server.py
      - name: Prove both suites can fail, by injecting real faults
        run: |
          uv run --with mcp --python 3.12 python scripts/test_mcp_server_faults.py
          uv run --with mcp --python 3.12 python scripts/test_mcp_kit_server_faults.py

  bundle:
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
      - name: Pack both bundles
        run: |
          set -eu
          python3 scripts/mcp_bundle.py claimgate
          python3 scripts/mcp_bundle.py claimgate-kit
      - name: Check the PACKED bundles, not the source they came from
        run: |
          set -eu
          # Only jsonschema is requested here on purpose. The checker provides
          # its own MCP SDK for the stdio suites, because the first version of
          # this step ran under an environment without `mcp` and reported both
          # bundles as failing - a dependency missing from the CHECK, reported
          # as a fault in the artifact. Running it this way keeps that honest.
          uv run --with jsonschema --python 3.12 python scripts/check_mcpb_artifact.py
          uv run --with jsonschema --python 3.12 python scripts/test_check_mcpb_artifact.py
          uv run --with jsonschema --python 3.12 python scripts/check_mcpb_artifact.py --fixtures
      - name: Refuse to publish a bundle the registry entry does not pin
        run: |
          set -eu
          VERSION="${GITHUB_REF_NAME#v}"
          # Each registry entry records a fileSha256 for one URL. If a tag ever
          # moves ahead of those entries, the built bundle hashes to something
          # else, and publishing it would leave the entries pointing at bytes
          # that no longer match - installable-looking and unverifiable. The
          # entries and the tag move together, or not at all.
          for stem in claimgate claimgate-kit; do
            case "$stem" in
              claimgate) src=mcp ;;
              *)         src=mcp-kit ;;
            esac
            built="dist/$stem-$VERSION.mcpb"
            pinned="$(python3 scripts/pinned_hash.py "$src/server.json")"
            actual="$(sha256sum "$built" | cut -d' ' -f1)"
            if [ "$pinned" != "$actual" ]; then
              echo "$src/server.json pins $pinned but $built hashes to $actual" >&2
              echo "update $src/server.json, then re-tag" >&2
              exit 1
            fi
            echo "$stem: the registry entry's pinned hash matches the built bundle"
          done
      - name: Publish both bundles on the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          VERSION="${GITHUB_REF_NAME#v}"
          # A tag can exist before its release does, and `gh release upload`
          # against a release that is not there fails the job - which is what
          # happened on the first run of this workflow. The release is created
          # if it is missing rather than assumed to exist.
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 \
            || gh release create "$GITHUB_REF_NAME" \
                 --title "ClaimGate $GITHUB_REF_NAME" \
                 --notes "See the commit history for what is in this release."
          for stem in claimgate claimgate-kit; do
            gh release upload "$GITHUB_REF_NAME" "dist/$stem-$VERSION.mcpb" --clobber
          done
          gh release view "$GITHUB_REF_NAME" --json assets --jq '.assets[].name'
