name: MCP bundle

# Builds the MCP Bundle and, on a tag, attaches it to the release the MCP
# Registry entry points at. The registry fetches that URL and requires its
# SHA-256 to equal the fileSha256 recorded in the registry entry, so this
# workflow and the registry entry have to be changed together, never by hand.

on:
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - "mcp/**"
      - "scripts/mcp_bundle.py"
      - ".github/workflows/mcp-bundle.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
      - name: Test the MCP server over real stdio
        run: uv run --with mcp --python 3.12 python scripts/test_mcp_server.py

  bundle:
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
      - name: Pack the bundle
        run: python3 scripts/mcp_bundle.py
      - name: Publish the bundle on the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          VERSION="${GITHUB_REF_NAME#v}"
          # A tag can exist before its release does, and `gh release upload`
          # against a release that is not there fails the job - which is what
          # happened on the first run of this workflow. The release is created
          # if it is missing rather than assumed to exist.
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 \
            || gh release create "$GITHUB_REF_NAME" \
                 --title "ClaimGate $GITHUB_REF_NAME" \
                 --notes "See the commit history for what is in this release."
          gh release upload "$GITHUB_REF_NAME" "dist/claimgate-$VERSION.mcpb" --clobber
          gh release view "$GITHUB_REF_NAME" --json assets \
            --jq '.assets[].name' 
